<title>Raiven</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap">

<style>
  /* ─── Layout: centered card, full-bleed dark gaming canvas ─── */
  :root {
    --bg:        #080c14;
    --bg2:       #0f1624;
    --card:      #111827;
    --border:    #1e2d4a;
    --fg:        #e8edf5;
    --fg-muted:  #6b7e99;
    --accent:    #00c8ff;
    --accent2:   #7c3aed;
    --glow:      rgba(0, 200, 255, 0.18);
    --glow2:     rgba(124, 58, 237, 0.14);

    --font-display: 'Orbitron', 'Courier New', monospace;
    --font-body:    'Inter', system-ui, sans-serif;
  }

  /* single-theme: deliberately dark gaming world */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
    overflow-x: hidden;
    color-scheme: dark;
  }

  /* ─── Animated grid background ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* radial vignette to fade grid edges */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 30%, var(--bg) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ─── Avatar ring ─── */
  .avatar-ring {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 3px;
    margin-bottom: 20px;
    box-shadow: 0 0 28px var(--glow), 0 0 60px var(--glow2);
    animation: pulse-ring 3s ease-in-out infinite;
    flex-shrink: 0;
  }

  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: -1px;
    text-shadow: 0 0 20px var(--accent);
  }

  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 28px var(--glow), 0 0 60px var(--glow2); }
    50%       { box-shadow: 0 0 48px rgba(0,200,255,0.32), 0 0 90px rgba(124,58,237,0.22); }
  }

  /* ─── Name & tagline ─── */
  .name {
    font-family: var(--font-display);
    font-size: clamp(26px, 7vw, 38px);
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent) 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    text-shadow: none;
    margin-bottom: 14px;
  }

  .tagline {
    font-size: 15px;
    line-height: 1.55;
    color: var(--fg-muted);
    text-align: center;
    max-width: 340px;
    margin-bottom: 36px;
    font-weight: 500;
  }

  .tagline strong {
    color: var(--fg);
    font-weight: 600;
  }

  /* ─── Divider ─── */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), var(--accent2), var(--border), transparent);
    margin-bottom: 32px;
    opacity: 0.7;
  }

  /* ─── Links ─── */
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 22px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s, background 0.2s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .link-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--glow), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .link-btn:hover {
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--glow), 0 4px 24px rgba(0,0,0,0.4);
    transform: translateY(-2px);
    background: #131e30;
  }

  .link-btn:hover::before { opacity: 1; }

  .link-btn:active { transform: translateY(0); }

  .link-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .link-icon svg { width: 22px; height: 22px; display: block; }

  .link-icon.yt  { background: rgba(255,48,48,0.15); }
  .link-icon.tt  { background: rgba(0,255,220,0.12); }
  .link-icon.dc  { background: rgba(88,101,242,0.18); }

  .link-label {
    position: relative;
    z-index: 1;
    flex: 1;
  }

  .link-arrow {
    position: relative;
    z-index: 1;
    color: var(--fg-muted);
    font-size: 18px;
    transition: color 0.2s, transform 0.2s;
  }

  .link-btn:hover .link-arrow {
    color: var(--accent);
    transform: translateX(3px);
  }

  /* ─── Footer ─── */
  .footer {
    margin-top: 44px;
    font-size: 12px;
    color: var(--fg-muted);
    font-family: var(--font-display);
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.5;
    text-align: center;
  }

  /* ─── Scan line animation ─── */
  @keyframes scanline {
    0%   { transform: translateY(-100%); }
    100% { transform: translateY(100vh); }
  }

  .scanline {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.08;
    animation: scanline 6s linear infinite;
    pointer-events: none;
    z-index: 2;
  }

  @media (prefers-reduced-motion: reduce) {
    .avatar-ring { animation: none; }
    .scanline     { animation: none; }
    .link-btn     { transition: none; }
  }
</style>

<div class="scanline"></div>

<div class="page">
  <div class="avatar-ring" aria-hidden="true">
    <div class="avatar-inner">R</div>
  </div>

  <h1 class="name">Raiven</h1>

  <p class="tagline">
    Ich bin Raiven!<br>
    Ein <strong>Roblox YouTuber</strong> und <strong>Roblox Streamer!</strong>
  </p>

  <div class="divider" aria-hidden="true"></div>

  <nav class="links" id="link-list" aria-label="Social Links">
    <!-- filled by script from links.json -->
  </nav>

  <p class="footer">Raiven &bull; Roblox Creator</p>
</div>

<script>
  const ICONS = {
    youtube: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.54C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z" fill="#ff3030"/>
      <polygon points="9.75,15.02 15.5,12 9.75,8.98 9.75,15.02" fill="#fff"/>
    </svg>`,

    tiktok: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34l-.01-8.83a8.27 8.27 0 0 0 4.84 1.56V4.59a4.85 4.85 0 0 1-1.06-.1z" fill="#00ffdc"/>
    </svg>`,

    discord: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.053a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" fill="#5865f2"/>
    </svg>`
  };

  async function loadLinks() {
    const list = document.getElementById('link-list');
    try {
      const res = await fetch('links.json');
      const data = await res.json();
      data.links.forEach(item => {
        const a = document.createElement('a');
        a.className = 'link-btn';
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const iconClass = item.icon === 'youtube' ? 'yt' : item.icon === 'tiktok' ? 'tt' : 'dc';

        a.innerHTML = `
          <span class="link-icon ${iconClass}">${ICONS[item.icon] || ''}</span>
          <span class="link-label">${item.label}</span>
          <span class="link-arrow" aria-hidden="true">›</span>
        `;
        list.appendChild(a);
      });
    } catch (e) {
      list.innerHTML = '<p style="color:var(--fg-muted);text-align:center;font-size:13px;">Links konnten nicht geladen werden.</p>';
    }
  }

  loadLinks();
</script>
